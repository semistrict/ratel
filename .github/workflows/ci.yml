name: ci

on:
  push:
    branches:
      - main
      - v23
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          unformatted=$(find pkg/ -name '*.go' -not -path '*/testdata/*' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libedit-dev libncurses-dev ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('c-deps/geos/**', 'c-deps/jemalloc/**', 'c-deps/proj/**') }}
          restore-keys: ccache-linux-
      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --set-config=max_size=500M
          ccache --zero-stats
      - name: Cache c-deps
        uses: actions/cache@v4
        with:
          path: |
            lib/build
            c-deps/jemalloc-build
            c-deps/geos-build
            c-deps/proj-build
          key: c-deps-linux-${{ hashFiles('c-deps/geos/**', 'c-deps/jemalloc/**', 'c-deps/proj/**') }}
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-linux-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-linux-
      - name: Build
        run: make -j$(nproc) buildratel
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: 1
      - name: Vet
        run: make vet
      - name: Compile all tests
        run: make testcompile
      - name: Smoketest
        run: make smoketest
      - name: Workers platform tests
        run: go test -mod=vendor -run 'TestWorkerd|TestDOStorage|TestRouterScript|TestSplitWorker' -v -count=1 -timeout 120s ./pkg/server/
      - name: KV benchmarks (compile only)
        run: go test -mod=vendor -bench 'BenchmarkSingleNode' -run '^$' -benchtime=1x -count=1 ./pkg/kv/kvserver/
