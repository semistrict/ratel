<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <defs>
    <linearGradient id="mantle" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#c8b899"/>
      <stop offset="60%" stop-color="#a8926e"/>
      <stop offset="100%" stop-color="#7a6548"/>
    </linearGradient>
    <linearGradient id="darkfur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52423a"/>
      <stop offset="100%" stop-color="#362a22"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="250" cy="310" rx="185" ry="12" fill="#00000010"/>

  <!-- Tail -->
  <path d="M 52 180 Q 28 162 18 142 Q 10 122 16 110"
        fill="none" stroke="#4a3a30" stroke-width="15" stroke-linecap="round"/>

  <!-- === FAR LEGS === -->
  <!-- Hind leg far -->
  <path d="M 110 238 Q 100 262 92 278 Q 86 290 78 296 L 62 300"
        fill="none" stroke="#362a22" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2a201a"><circle cx="58" cy="302" r="3"/><circle cx="65" cy="304" r="3"/><circle cx="72" cy="304" r="3"/></g>

  <!-- Front leg far -->
  <path d="M 340 235 Q 348 262 352 278 Q 354 290 350 296 L 336 302"
        fill="none" stroke="#362a22" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2a201a"><circle cx="331" cy="304" r="3"/><circle cx="338" cy="306" r="3"/><circle cx="345" cy="305" r="3"/></g>

  <!-- Body - dark lower portion, flatter/more rectangular -->
  <path d="M 60 190
           Q 50 200 52 218
           Q 56 242 90 258
           Q 130 275 200 272
           Q 280 270 335 255
           Q 362 245 370 225
           Q 375 208 368 192
           Q 355 175 320 165
           Q 270 152 200 150
           Q 130 152 90 165
           Q 68 175 60 190 Z"
        fill="url(#darkfur)"/>

  <!-- Belly fur highlight -->
  <path d="M 100 260 Q 160 272 230 270 Q 290 268 330 255"
        fill="none" stroke="#5a4a3e" stroke-width="3" opacity="0.4"/>

  <!-- Mantle - silver cape from crown down back -->
  <path d="M 80 172
           Q 68 160 65 175
           Q 60 190 68 195
           L 80 182
           Q 110 158 175 145
           Q 230 138 290 142
           Q 340 148 365 162
           Q 378 172 382 188
           Q 390 172 378 152
           Q 358 128 325 115
           Q 288 103 245 100
           Q 195 98 155 105
           Q 120 113 98 130
           Q 82 148 78 168 Z"
        fill="url(#mantle)"/>

  <!-- === NEAR LEGS === -->
  <!-- Hind leg near -->
  <path d="M 135 248 Q 125 272 118 288 Q 114 298 106 302 L 92 307"
        fill="none" stroke="#4a3a30" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2a201a"><circle cx="86" cy="309" r="3.5"/><circle cx="93" cy="311" r="3.5"/><circle cx="101" cy="311" r="3.5"/></g>

  <!-- Front leg near -->
  <path d="M 350 240 Q 360 268 364 285 Q 366 296 362 302 L 348 308"
        fill="none" stroke="#4a3a30" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2a201a"><circle cx="342" cy="310" r="3.5"/><circle cx="350" cy="312" r="3.5"/><circle cx="358" cy="311" r="3.5"/></g>

  <!-- Neck -->
  <path d="M 365 185 Q 385 168 400 152 Q 412 138 415 150 Q 412 168 398 180 Q 382 192 368 195"
        fill="url(#darkfur)"/>
  <!-- Neck mantle connection -->
  <path d="M 362 168 Q 378 150 392 140 Q 400 134 405 138 Q 398 130 388 132 Q 374 138 362 152 Z"
        fill="#a8926e" opacity="0.6"/>

  <!-- Head - larger, more prominent -->
  <path d="M 388 108
           Q 395 92 412 88
           Q 430 86 442 95
           Q 455 108 455 125
           Q 453 140 442 150
           Q 430 158 415 156
           Q 400 152 392 140
           Q 385 128 388 112 Z"
        fill="#3e3028"/>

  <!-- Head crown lighter area -->
  <path d="M 395 100 Q 405 88 418 86 Q 432 87 440 95 Q 430 88 418 90 Q 405 92 398 102 Z"
        fill="#7a6548" opacity="0.5"/>

  <!-- Ears -->
  <ellipse cx="408" cy="90" rx="7" ry="5.5" fill="#3e3028" transform="rotate(-10 408 90)"/>
  <ellipse cx="425" cy="90" rx="8" ry="6" fill="#4a3c30" transform="rotate(5 425 90)"/>
  <ellipse cx="425" cy="90" rx="5" ry="3.5" fill="#3a2e24" transform="rotate(5 425 90)"/>

  <!-- Eye -->
  <circle cx="440" cy="115" r="8" fill="#1a1510"/>
  <circle cx="440" cy="115" r="6" fill="#221a12"/>
  <circle cx="442" cy="113" r="2.5" fill="#fff" opacity="0.55"/>

  <!-- Brow ridge -->
  <path d="M 432 108 Q 438 105 446 108" fill="none" stroke="#2e2420" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Snout -->
  <path d="M 450 130 Q 462 125 468 132 Q 472 140 467 146 Q 460 150 454 146 Q 448 140 450 132 Z"
        fill="#1a1510"/>
  <circle cx="465" cy="136" r="2.2" fill="#0a0806"/>

  <!-- Mouth -->
  <path d="M 462 146 Q 455 153 448 156" fill="none" stroke="#2a201a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cheek/jaw line -->
  <path d="M 430 150 Q 440 155 448 152" fill="none" stroke="#4a3a30" stroke-width="1.2" opacity="0.5"/>
</svg>
