<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Honey badger body -->
  <ellipse cx="100" cy="120" rx="52" ry="35" fill="#3d3d3d"/>

  <!-- White stripe (signature honey badger marking) -->
  <path d="M 55 85 Q 70 78 100 76 Q 130 78 145 85 L 142 95 Q 128 88 100 86 Q 72 88 58 95 Z" fill="#e8e8e8"/>

  <!-- Head -->
  <ellipse cx="100" cy="88" rx="30" ry="22" fill="#4a4a4a"/>

  <!-- White face stripe -->
  <path d="M 78 80 Q 90 72 100 71 Q 110 72 122 80 L 120 86 Q 110 80 100 79 Q 90 80 80 86 Z" fill="#d4d4d4"/>

  <!-- Ears -->
  <ellipse cx="78" cy="72" rx="7" ry="5" fill="#3d3d3d"/>
  <ellipse cx="122" cy="72" rx="7" ry="5" fill="#3d3d3d"/>

  <!-- Eyes -->
  <circle cx="90" cy="86" r="4" fill="#1a1a2e"/>
  <circle cx="110" cy="86" r="4" fill="#1a1a2e"/>
  <circle cx="91" cy="85" r="1.5" fill="#fff"/>
  <circle cx="111" cy="85" r="1.5" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="100" cy="96" rx="5" ry="3.5" fill="#2a2a2a"/>

  <!-- Front legs -->
  <rect x="78" y="145" width="12" height="20" rx="5" fill="#3d3d3d"/>
  <rect x="110" y="145" width="12" height="20" rx="5" fill="#3d3d3d"/>

  <!-- Claws -->
  <line x1="80" y1="165" x2="78" y2="170" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="84" y1="165" x2="84" y2="171" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="88" y1="165" x2="90" y2="170" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="112" y1="165" x2="110" y2="170" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="116" y1="165" x2="116" y2="171" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="120" y1="165" x2="122" y2="170" stroke="#ccc" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tail -->
  <path d="M 148 110 Q 165 100 170 85 Q 172 78 168 75" fill="none" stroke="#3d3d3d" stroke-width="8" stroke-linecap="round"/>

  <!-- Text -->
  <text x="100" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#e0e0e0" letter-spacing="3">RATEL</text>
</svg>
