name: synctest-jepsen

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  synctest-jepsen:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf libedit-dev
      - name: Vendor setup
        run: make vendor/modules.txt
      - name: Build c-deps
        run: make -j$(nproc) c-deps
      - name: Synctest Jepsen
        run: |
          make test \
            PKG=./pkg/testutils/inproc \
            TESTS='^(TestSyncRestartThenFreshBubble|TestSyncJepsen|TestJepsen)$' \
            TESTFLAGS="-v -count=3 -timeout 60s"
