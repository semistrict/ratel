name: synctest

on:
  push:
  pull_request:

jobs:
  synctest:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf libedit-dev
      - name: Vendor setup
        run: |
          make vendor/modules.txt
      - name: Build c-deps
        run: make -j$(nproc) c-deps
      - name: Synctest
        run: |
          # Run each test individually to avoid goroutine leaks between
          # non-synctest and synctest tests within the same test binary.
          # Note: synctest + race detector is incompatible (hangs), so
          # synctest tests run without -race, non-synctest tests with -race.
          synctest_tests=(
            TestSyncInprocSmoke
            TestSyncTestSmoke
            TestSyncRestart
            TestSyncNetworkPartition
            TestSyncFakeTime
            TestSyncClockJump
            TestSyncAddVoters
            TestSyncAutoReplication
            TestSyncRaftRestartWithReplication
            TestSyncLeaseTransfer
            TestSyncDecommission
          )
          for t in "${synctest_tests[@]}"; do
            echo "=== Running $t ==="
            make test PKG=./pkg/testutils/inproc TESTS="$t" TESTFLAGS="-v -count=1 -timeout 30s"
          done

          race_tests=(
            TestInprocSmoke
            TestAddVoters
            TestAutoReplication
            TestDecommission
            TestLeaseTransferAfterAddVoters
          )
          for t in "${race_tests[@]}"; do
            echo "=== Running $t (race) ==="
            make testrace PKG=./pkg/testutils/inproc TESTS="$t" TESTFLAGS="-v -count=1 -timeout 60s"
          done
