name: ci

on:
  push:
  pull_request:

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          unformatted=$(find pkg/ -name '*.go' -not -path '*/testdata/*' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libedit-dev libncurses-dev
      - name: Build
        run: make -j$(nproc) buildshort
        env:
          BROWSERSLIST_IGNORE_OLD_DATA: 1
      - name: Vet
        run: go vet -mod=vendor -tags 'make short' ./pkg/...
      - name: Compile all tests
        run: make testcompile
      - name: Smoketest
        run: make smoketest
